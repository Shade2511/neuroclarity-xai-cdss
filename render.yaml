services:
  - type: web
    name: neuroclarity-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/neuroclarity.db
      - key: ALLOWED_ORIGINS
        value: https://neuroclarity-xai-cdss.pages.dev,https://neuroclarity-xai-cdss.pages.dev/
      - key: ENVIRONMENT
        value: production
    disk:
      name: neuroclarity-data
      mountPath: /data
      sizeGB: 1
